[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Long-cache product media (photos + videos). Filenames are stable so we can
# treat them as immutable for a year — the browser will reuse the cached copy
# on revisits instead of re-fetching the whole video.
[[headers]]
  for = "/assets/Products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Same idea for any other static asset under /assets — safe because Vite
# hashes its build outputs.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"